<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEO Fleet Dashboard</title>

    <link rel="stylesheet" href="index.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <h2>CEO Fleet Dashboard</h2>

    <div class="dashboard">
      <div class="card">
        <h2>Overall Data</h2>
        <div class="summary-box">
          <div class="kpi kpi-total" id="assetStats"></div>

          <div class="kpi kpi-online" id="onlineStats"></div>

          <div class="kpi kpi-offline" id="offlineStats"></div>

          <div class="kpi kpi-movable" id="movableStats"></div>

          <div class="kpi kpi-immovable" id="immovableStats"></div>
        </div>

        <div class="header" onclick="toggle('fleetTable')">View Fleet</div>
        <input
          type="text"
          id="driverFilter"
          placeholder="Filter by driver..."
        />
        <div class="content" id="fleetTable">
          <table class="fleet-table">
            <thead>
              <tr>
                <th>Vehicle</th>
                <th>Driver</th>
                <th>Status</th>
                <th>Idle</th>
              </tr>
            </thead>
            <tbody id="fleetBody"></tbody>
          </table>
        </div>
      </div>

      <div class="middle">
        <div class="card">
          <div class="stats">Mileage</div>
          <canvas id="myChart"></canvas>
        </div>

        <div class="card">
          <div class="stats">Fuel</div>
          <canvas id="fuelChart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="stats">Top 5 Fuel Loss</div>

        <div class="header" onclick="toggle('insightDetails')">
          View Insights
        </div>

        <div class="content" id="insightDetails">
          <table class="insight-table">
            <thead>
              <tr>
                <th>Vehicle</th>
                <th>Fuel Loss (L)</th>
                <th>Efficiency (km/L)</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="insightBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
